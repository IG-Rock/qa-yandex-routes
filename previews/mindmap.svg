<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Яндекс.Маршруты · карта проверок">
<rect width="900" height="370" rx="18" fill="#102138"/>
<g font-family="system-ui, sans-serif">
